name: Main port verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: '-D warnings'

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Main port ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 1803
            commit: 487ad9a09fba4559979f284826e72ba7d5400d68
          - pr: 1804
            commit: b09a131b5bd320c0c5fdb3650de863b07a30a621
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: main-port-${{ matrix.pr }}
      - name: Record exact source
        run: |
          mkdir -p target/main-port-proof
          git rev-parse HEAD | tee target/main-port-proof/source-sha.txt
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Regenerate stylesheet for this main-based source
        env:
          TAILWIND_BUILD: '1'
        run: cargo build --locked -p ai-memory-web
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Recovery guard-removal proof
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          logs = Path('target/main-port-proof')
          logs.mkdir(exist_ok=True)
          test_name = 'interrupted_recovery_refuses_foreign_scope_owner_and_receiver_with_controls'
          command = ['cargo', 'test', '--locked', '-p', 'ai-memory-store', '--lib', test_name, '--', '--nocapture']

          def run(label):
              result = subprocess.run(command, capture_output=True, text=True)
              output = result.stdout + result.stderr
              (logs / (label + '.log')).write_text(output)
              return result.returncode, output

          code, output = run('baseline')
          assert code == 0 and '1 passed' in output, output[-12000:]
          path = Path('crates/ai-memory-store/src/reader.rs')
          original = path.read_text()
          start = original.index('    pub async fn latest_interrupted_session_candidate(')
          end = original.index('    // Eight arguments', start)
          fragment = original[start:end]
          assert fragment.count('s.actor_user = :actor)') == 1
          assert fragment.count(' AND s.id != :receiver') == 1

          def without_scope(value):
              value, workspaces = re.subn(r'\b\w+\.workspace_id = :ws', '(:ws IS NOT NULL)', value)
              value, projects = re.subn(r'\b\w+\.project_id = :proj', '(:proj IS NOT NULL)', value)
              assert workspaces >= 2 and projects >= 2
              return value

          cases = [
              ('recovery-owner', fragment.replace('s.actor_user = :actor)', 's.actor_user = :actor OR 1 = 1)'), 'newer foreign scope and owner rows'),
              ('recovery-scope', without_scope(fragment), 'newer foreign scope and owner rows'),
              ('recovery-receiver', fragment.replace(' AND s.id != :receiver', ' AND :receiver IS NOT NULL'), 'the receiver cannot recover its own observations'),
          ]
          results = []
          try:
              for label, changed, assertion in cases:
                  assert changed != fragment
                  path.write_text(original[:start] + changed + original[end:])
                  code, output = run(label)
                  assert code != 0, label + ' survived'
                  assert 'could not compile' not in output and 'error[E' not in output, output[-12000:]
                  assert 'FAILED' in output and assertion in output and 'panicked at' in output, output[-12000:]
                  results.append(dict(case=label, result='killed by intended assertion'))
                  print('MUTATION_KILLED', label, flush=True)
          finally:
              path.write_text(original)
          code, output = run('restored')
          assert code == 0 and '1 passed' in output, output[-12000:]
          (logs / 'mutations.json').write_text(json.dumps(results, indent=2) + '\n')
          print('Restored baseline passed; all three recovery guards detected their deliberate faults.')
          PY
      - name: Confirm source restoration
        run: |
          git diff --exit-code -- . ':!crates/ai-memory-web/static/tailwind.css'
      - name: Save regenerated CSS and proof logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-port-${{ matrix.pr }}
          path: |
            crates/ai-memory-web/static/tailwind.css
            target/main-port-proof
