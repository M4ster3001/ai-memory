name: Remaining main verification
on:
  workflow_dispatch:
    inputs:
      sources:
        description: Exact source commits and required companion/browser checks
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: '-D warnings'
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: Remaining main PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.sources) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: main-port-1804
          cache-on-failure: true
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
        with:
          tool: cargo-nextest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Record exact source and static gates
        run: |
          mkdir -p target/remaining-proof
          git rev-parse HEAD | tee target/remaining-proof/source-sha.txt
          test "$(git rev-parse HEAD)" = "${{ matrix.commit }}"
          cargo fmt --all -- --check
          git diff --check f32a9c5334185d0f35702d3ea50d094f83d0da82...HEAD
          bash scripts/check-changelog-sections.sh
          python3 scripts/changelog_sections.py frozen f32a9c5334185d0f35702d3ea50d094f83d0da82 --root .
      - name: Regenerate stylesheet for exact main source
        env:
          TAILWIND_BUILD: '1'
        run: cargo build --locked -p ai-memory-web
      - name: Bounded MCP read adversarial proof
        if: matrix.pr == 17
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          logs=Path('target/remaining-proof');logs.mkdir(exist_ok=True)
          command=['cargo','test','--locked','-p','ai-memory-mcp','--lib','bob_does_not_see_restricted_pages_through_the_related_walk','--','--nocapture']
          def run(label):
           r=subprocess.run(command,capture_output=True,text=True);out=r.stdout+r.stderr
           (logs/(label+'.log')).write_text(out)
           return r.returncode,out
          code,out=run('bounded-read-baseline');assert code==0 and '1 passed' in out,out[-10000:]
          path=Path('crates/ai-memory-mcp/src/server.rs');original=path.read_text()
          start=original.index('        let related = if args.include_related');end=original.index('        // An expired page',start);fragment=original[start:end]
          needle='Self::viewer_from_parts(Some(&parts))';assert fragment.count(needle)==1
          try:
           path.write_text(original[:start]+fragment.replace(needle,'None')+original[end:])
           code,out=run('bounded-read-missing-viewer')
           assert code!=0 and 'FAILED' in out and 'a restricted page leaked through the related walk' in out,out[-10000:]
           assert 'could not compile' not in out and 'error[E' not in out,out[-10000:]
          finally:path.write_text(original)
          code,out=run('bounded-read-restored');assert code==0 and '1 passed' in out,out[-10000:]
          (logs/'bounded-read-proof.json').write_text(json.dumps(dict(result='guard removal killed by intended assertion; restored baseline passed'))+'\n')
          print('BOUNDED_READ_GUARD_KILLED_AND_RESTORED')
          PY
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full workspace tests, every tier
        run: cargo nextest run --locked --workspace --all-targets --profile ci
      - name: Doctests
        run: cargo test --locked --workspace --doc
      - name: Build real server for SDK and browser checks
        if: matrix.sdk || matrix.browser
        run: cargo build --locked --bin ai-memory
      - name: SDK typecheck, unit, schema and generated documentation checks
        if: matrix.sdk
        working-directory: companions/ai-memory-ts
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: SDK integration and live schema drift checks
        if: matrix.sdk
        working-directory: companions/ai-memory-ts
        env:
          AI_MEMORY_BIN: ${{ github.workspace }}/target/debug/ai-memory
        run: npm run test:integration
      - name: Install pinned Chromium
        if: matrix.browser
        run: npx --yes playwright@1.63.0 install --with-deps --only-shell chromium
      - name: Real browser baseline and mutation gates
        if: matrix.browser
        env:
          AI_MEMORY_BIN: ${{ github.workspace }}/target/debug/ai-memory
        run: node tests/e2e/web_dashboard_mutations.mjs
      - name: Dashboard Rust mutation gates
        if: matrix.browser
        run: python3 scripts/check-dashboard-core-mutations.py
      - name: Confirm all fault edits were restored
        run: git diff --exit-code -- . ':!crates/ai-memory-web/static/tailwind.css'
      - name: Save stylesheet and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-main-${{ matrix.pr }}
          path: |
            crates/ai-memory-web/static/tailwind.css
            target/remaining-proof
            target/web-dashboard-mutations.json
            target/dashboard-core-mutations-*
